server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    open-in-view: false

  sql:
    init:
      mode: always
      encoding: UTF-8

jwt:
  secret: VGhpc0lzQVNlY3VyZTI1NkJpdEtleUZvckRldlVzZU9ubHkxMjM0
  expiration: 86400000